<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="International Women's Day 2025 - Celebrating Women Around the World">
  <title>International Women's Day 2025</title>
  <link rel="stylesheet" href="/styles/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Countdown Screen -->
    <section id="countdown-screen" class="screen active">
      <div class="sparkle-container" id="sparkles"></div>
      <div class="bud-container" id="bud-animation">
        <svg class="rose-bud" viewBox="0 0 100 150" id="rose-bud">
          <!-- Rose bud SVG will be here -->
        </svg>
      </div>
      <div class="countdown-content">
        <h1 class="teaser-title">Something Beautiful is Coming...</h1>
        <p class="teaser-subtitle">International Women's Day 2025</p>
        <div class="countdown-timer" id="countdown">
          <div class="time-block">
            <span class="time-value" id="days">00</span>
            <span class="time-label">Days</span>
          </div>
          <div class="time-separator">:</div>
          <div class="time-block">
            <span class="time-value" id="hours">00</span>
            <span class="time-label">Hours</span>
          </div>
          <div class="time-separator">:</div>
          <div class="time-block">
            <span class="time-value" id="minutes">00</span>
            <span class="time-label">Minutes</span>
          </div>
          <div class="time-separator">:</div>
          <div class="time-block">
            <span class="time-value" id="seconds">00</span>
            <span class="time-label">Seconds</span>
          </div>
        </div>
        <p class="anticipation-message" id="anticipation-msg">The celebration awaits...</p>
      </div>
      <button class="sound-toggle" id="sound-toggle" aria-label="Toggle sound">
        <svg class="sound-on" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
        <svg class="sound-off" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
          <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
        </svg>
      </button>
    </section>

    <!-- Celebration Screen -->
    <section id="celebration-screen" class="screen">
      <div class="petals-container" id="petals"></div>
      <div class="celebration-content">
        <h1 class="celebration-title" id="celebration-title">Happy International Women's Day!</h1>
        <div class="bouquet-container" id="bouquet">
          <!-- Rose bouquet SVG will be inserted here -->
        </div>
        <p class="celebration-subtitle">Celebrating the strength, courage, and achievements of women everywhere</p>
        <button class="message-button" id="message-btn">
          <span class="btn-icon">✨</span>
          Get Your Empowerment Message
          <span class="btn-icon">✨</span>
        </button>
        <div class="message-display" id="message-display">
          <blockquote id="quote-text"></blockquote>
          <cite id="quote-author"></cite>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
